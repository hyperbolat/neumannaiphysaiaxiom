<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PhysAI Axiom — Чат</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --border: #334155;
    --text: #ffffff;
    --text-muted: #94a3b8;
    --text-light: #cbd5e1;
    --accent: #3b82f6;
    --accent-green: #10b981;
    --accent-red: #f43f5e;
    --accent-orange: #ff9800;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  header h1 {
    font-size: 16px;
    font-weight: 600;
    color: var(--accent);
    margin: 0;
    letter-spacing: 0.5px;
  }
  header span {
    font-size: 11px;
    color: var(--text-muted);
    border: 1px solid var(--border);
    padding: 2px 8px;
    border-radius: 999px;
  }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
  }

  .msg-row { display: flex; }
  .msg-row.user { justify-content: flex-end; }
  .msg-row.assistant { justify-content: flex-start; }

  .bubble-user {
    background: var(--accent);
    color: white;
    padding: 12px 16px;
    border-radius: 14px 14px 2px 14px;
    max-width: 75%;
    font-size: 14px;
    line-height: 1.5;
  }

  .bubble-assistant {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px 14px 14px 2px;
    max-width: 90%;
    width: 100%;
    overflow: hidden;
  }

  .bubble-assistant .note {
    padding: 14px 18px;
    font-size: 13px;
    color: var(--text-light);
    line-height: 1.5;
  }
  .bubble-assistant .note.error { color: var(--accent-red); }

  .target-prompt {
    display: flex;
    gap: 8px;
    padding: 0 18px 14px 18px;
  }
  .target-prompt input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 10px;
    font-family: "Courier New", monospace;
    font-size: 13px;
  }
  .target-prompt button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  .target-prompt button:hover { opacity: 0.85; }

  .thinking {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 18px;
    color: var(--text-muted);
    font-size: 13px;
  }
  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.2s infinite ease-in-out;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1.1); }
  }

  #input-bar {
    flex-shrink: 0;
    border-top: 1px solid var(--border);
    padding: 16px 24px;
  }
  #input-form {
    max-width: 820px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
  }
  #task-input {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 14px;
    font-family: inherit;
    resize: none;
  }
  #task-input:focus { outline: none; border-color: var(--accent); }
  #send-btn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 0 22px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #send-btn:hover { opacity: 0.9; }
  #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .empty-hint {
    color: var(--text-muted);
    font-size: 13px;
    text-align: center;
    margin-top: 60px;
    line-height: 1.8;
  }
  .empty-hint b { color: var(--text-light); }
</style>
</head>
<body>

<header>
  <h1>⚛ PhysAI Axiom</h1>
  <span>чат-режим</span>
</header>

<div id="chat">
  <div class="empty-hint" id="empty-hint">
    Напишите условие физической задачи своими словами —<br>
    например: <b>«Тело массой 2 кг под действием силы 10 Н. Найдите ускорение.»</b><br>
    Категория, данные и цель определяются автоматически.
  </div>
</div>

<div id="input-bar">
  <form id="input-form">
    <textarea id="task-input" rows="1" placeholder="Условие задачи..." autofocus></textarea>
    <button id="send-btn" type="submit">Решить</button>
  </form>
</div>

<script>
const chat = document.getElementById('chat');
const form = document.getElementById('input-form');
const input = document.getElementById('task-input');
const sendBtn = document.getElementById('send-btn');
const emptyHint = document.getElementById('empty-hint');

function scrollToBottom() {
  chat.scrollTop = chat.scrollHeight;
}

function addUserMessage(text) {
  emptyHint.style.display = 'none';
  const row = document.createElement('div');
  row.className = 'msg-row user';
  row.innerHTML = `<div class="bubble-user"></div>`;
  row.querySelector('.bubble-user').textContent = text;
  chat.appendChild(row);
  scrollToBottom();
}

function addThinkingBubble() {
  const row = document.createElement('div');
  row.className = 'msg-row assistant';
  row.innerHTML = `
    <div class="bubble-assistant">
      <div class="thinking">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        &nbsp;решаю...
      </div>
    </div>`;
  chat.appendChild(row);
  scrollToBottom();
  return row;
}

async function solve(text, targetOverride) {
  const resp = await fetch('/api/solve', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text: text, target_override: targetOverride || null })
  });
  return resp.json();
}

function renderAssistantResult(row, data, originalText) {
  const bubble = row.querySelector('.bubble-assistant');

  if (data.error) {
    bubble.innerHTML = `
      <div class="note error">⚠ ${escapeHtml(data.error)}</div>
      <div class="target-prompt">
        <input type="text" placeholder="имя переменной (например: a, v, t_period)" id="target-fix-input">
        <button id="target-fix-btn">Решить</button>
      </div>`;
    bubble.querySelector('#target-fix-btn').addEventListener('click', async () => {
      const t = bubble.querySelector('#target-fix-input').value.trim();
      if (!t) return;
      bubble.innerHTML = `<div class="thinking"><span class="dot"></span><span class="dot"></span><span class="dot"></span>&nbsp;решаю...</div>`;
      const result = await solve(originalText, t);
      renderAssistantResult(row, result, originalText);
    });
    return;
  }

  bubble.innerHTML = data.report_html;

  if (data.target_was_detected) {
    const hint = document.createElement('div');
    hint.className = 'note';
    hint.style.borderTop = '1px solid var(--border)';
    hint.style.fontSize = '11px';
    hint.style.color = 'var(--text-muted)';
    hint.textContent = `Цель определена автоматически: ${data.target}`;
    bubble.appendChild(hint);
  }
  scrollToBottom();
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;

  addUserMessage(text);
  input.value = '';
  input.style.height = 'auto';
  sendBtn.disabled = true;

  const row = addThinkingBubble();
  try {
    const data = await solve(text, null);
    renderAssistantResult(row, data, text);
  } catch (err) {
    row.querySelector('.bubble-assistant').innerHTML =
      `<div class="note error">⚠ Ошибка соединения с сервером: ${escapeHtml(String(err))}</div>`;
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
});

// Enter отправляет, Shift+Enter — перенос строки
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 150) + 'px';
});
</script>

</body>
</html>
